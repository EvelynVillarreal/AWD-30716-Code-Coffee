<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal | American Latin Class</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html" aria-label="American Latin Class">
      <span class="brand-mark">ALC</span>
      <span>
        <strong>American Latin Class</strong>
        <small>Dance school</small>
      </span>
    </a>

    <nav class="main-nav" aria-label="Main navigation">
      <a href="index.html">Home</a>
      <a href="enrollment.html">Enrollment</a>
      <a href="attendance-kiosk.html">Attendance</a>
      <a href="login.html" aria-current="page">Portal</a>
    </nav>
  </header>

  <main class="login-page">
    <section class="login-panel">
      <p class="eyebrow">Internal access</p>
      <h1>Sign in</h1>
      <form class="form-stack" id="loginForm">
        <label>
          <span>Email</span>
          <input id="loginEmail" type="email" placeholder="user@americanlatinclass.com" required>
        </label>
        <label>
          <span>Password</span>
          <input id="loginPassword" type="password" placeholder="********" required>
        </label>
        <button class="button primary" type="submit">Sign in</button>
        <p class="notice" id="loginMessage" aria-live="polite"></p>
      </form>
      <a class="text-link" href="attendance-kiosk.html">Register attendance by national ID</a>
    </section>
  </main>

  <script src="script/app.js?v=20260503-real-auth"></script>
</body>
</html>
