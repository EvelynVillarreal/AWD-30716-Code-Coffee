<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>School Portal | American Latin Class</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <script>if (localStorage.getItem("alc-theme")==="dark"||(!localStorage.getItem("alc-theme")&&window.matchMedia("(prefers-color-scheme:dark)").matches))document.documentElement.setAttribute("data-theme","dark")</script>
</head>
<body>
  <nav class="navbar navbar-expand-lg alc-navbar sticky-top">
    <div class="container-fluid px-lg-5">
      <a class="navbar-brand alc-brand" href="index.html" aria-label="American Latin Class">
        <span class="alc-brand-mark">ALC</span>
        <span>
          <strong>American Latin Class</strong>
          <small>Dance academy</small>
        </span>
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavigation" aria-controls="mainNavigation" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="mainNavigation">
        <div class="navbar-nav ms-auto align-items-lg-center gap-lg-2">
          <a class="nav-link" href="index.html">Home</a>
          <a class="nav-link" href="pricing.html">Pricing</a>
          <a class="nav-link" href="enrollment.html">Enrollment</a>
          <button class="btn btn-outline-light btn-sm theme-toggle" id="themeToggle" type="button" aria-label="Toggle theme">
            <i class="bi bi-moon-stars-fill theme-icon"></i>
          </button>
          <a class="btn btn-warning fw-bold ms-lg-2 active" href="login.html" aria-current="page">
            <i class="bi bi-person-badge"></i>
            School portal
          </a>
        </div>
      </div>
    </div>
  </nav>

  <main class="auth-layout">
    <section class="auth-panel">
      <p class="eyebrow">Internal access</p>
      <h1>School portal</h1>
      <p class="muted">Students, teachers, and directors use one access point with role-based modules.</p>
      <form class="form-stack" id="loginForm" autocomplete="off">
        <label>
          <span>Email</span>
          <input id="loginEmail" class="form-control form-control-lg" type="email" placeholder="student@americanlatinclass.com" autocomplete="off" autocapitalize="none" spellcheck="false" required>
        </label>
        <label>
          <span>Password</span>
          <div class="input-group input-group-lg">
            <input id="loginPassword" class="form-control" type="password" placeholder="********" autocomplete="new-password" required>
            <button class="btn btn-outline-secondary password-toggle" type="button" data-password-toggle="loginPassword" aria-label="Show password">
              <i class="bi bi-eye"></i>
            </button>
          </div>
        </label>
        <button class="btn btn-warning btn-lg fw-bold" type="submit">
          <i class="bi bi-box-arrow-in-right"></i>
          Sign in
        </button>
        <p class="notice" id="loginMessage" aria-live="polite"></p>
      </form>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script/config.js"></script>
  <script src="script/app.js?v=20260524-validation-routing"></script>
</body>
</html>
