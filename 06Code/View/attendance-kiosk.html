<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Attendance check-in | American Latin Class</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html" aria-label="American Latin Class">
      <span class="brand-mark">ALC</span>
      <span>
        <strong>American Latin Class</strong>
        <small>Attendance check-in</small>
      </span>
    </a>

    <nav class="main-nav" aria-label="Main navigation">
      <a href="index.html">Home</a>
      <a href="enrollment.html">Enrollment</a>
      <a href="attendance-kiosk.html" aria-current="page">Attendance</a>
      <a href="login.html">Portal</a>
    </nav>
  </header>

  <main class="login-page kiosk-page">
    <section class="login-panel">
      <p class="eyebrow">Class entry</p>
      <h1>Register attendance</h1>
      <form class="form-stack" id="kioskForm">
        <label>
          <span>Student national ID</span>
          <input id="kioskNationalId" type="text" inputmode="numeric" placeholder="1723456789" required>
        </label>
        <button class="button primary" type="submit">Register entry</button>
        <p class="notice" id="kioskMessage" aria-live="polite"></p>
      </form>
      <a class="text-link" href="login.html">Go to internal portal</a>
    </section>
  </main>

  <script src="script/app.js?v=20260503-real-auth"></script>
</body>
</html>
