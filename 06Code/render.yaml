services:
  - type: web
    name: american-latin-class-api
    runtime: docker
    repo: https://github.com/EvelynVillarreal/AWD-30716-Code-Coffee.git
    branch: main
    plan: free
    region: oregon
    rootDir: 06Code
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_TIMEZONE
        value: America/Bogota
      - key: APP_KEY
        sync: false
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "5432"
      - key: DB_DATABASE
        value: postgres
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSLMODE
        value: require
      - key: FRONTEND_ORIGINS
        value: https://american-latin-class-frontend.netlify.app,http://127.0.0.1:5173,http://localhost:5173
      - key: GOOGLE_CLIENT_ID
        sync: false

  - type: web
    name: american-latin-class-frontend
    runtime: static
    repo: https://github.com/EvelynVillarreal/AWD-30716-Code-Coffee.git
    branch: main
    plan: free
    region: oregon
    buildCommand: ""
    staticPublishPath: ./06Code/frontend
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
    routes:
      - type: rewrite
        source: /dashboard
        destination: /dashboard.html
      - type: rewrite
        source: /dashboard/*
        destination: /dashboard.html
